version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stockwise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockwise_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockwise_pass}
      POSTGRES_DB: ${POSTGRES_DB:-stockwise_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
